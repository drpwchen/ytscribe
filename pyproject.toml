[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytscribe"
version = "0.1.1"
description = "Fetch YouTube transcripts channel-wide — subtitles first, local Whisper as fallback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["youtube", "transcript", "subtitles", "whisper", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = ["yt-dlp>=2024.1.1"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.0"]

[project.scripts]
ytscribe = "ytscribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ytscribe"]
